name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload portable packages
        uses: actions/upload-artifact@v4
        with:
          name: cellular-garden-packages
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: artifacts/check/test-results.txt
          if-no-files-found: ignore
